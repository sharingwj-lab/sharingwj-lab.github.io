<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签上的标题 -->
    <title>Welcome to Sharing's Air Castle!</title>
    <style>
        /* --- 1. 整体氛围：布达佩斯大饭店式的红蓝撞色 --- */
        body {
            margin: 0;
            padding: 0;
            /* 神秘的深蓝夜空背景 */
            background: linear-gradient(to bottom, #101025, #2b102b);
            /* 文艺复古字体 */
            font-family: "Georgia", "Times New Roman", serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- 2. 城堡卡片容器 --- */
        .castle-card {
            /* 模仿电影海报的比例 */
            width: 500px;
            padding: 60px 40px;
            /* 独特的浅粉色背景，搭配深红边框 */
            background-color: #f7d8e3;
            border: 4px solid #9e2f50;
            /* 圆角增加复古感 */
            border-radius: 15px;
            text-align: center;
            /* 增加阴影，让城堡悬浮起来 */
            box-shadow: 0 0 30px rgba(158, 47, 80, 0.6),
                        inset 0 0 60px rgba(255, 255, 255, 0.2);
            position: relative;
            /* 动画：缓缓上浮 */
            animation: float 6s ease-in-out infinite;
        }

        /* --- 3. 标题设计 --- */
        h1 {
            /* 深红色字体 */
            color: #9e2f50;
            font-size: 36px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid #9e2f50;
            padding-bottom: 20px;
            /* 文艺的衬线体 */
            font-weight: normal;
        }

        /* --- 4. 装饰线条 --- */
        .divider {
            width: 60px;
            height: 3px;
            background-color: #2c3e50; /* 深蓝色点缀 */
            margin: 25px auto;
        }

        /* --- 5. 内容文本 --- */
        .content {
            color: #2c3e50; /* 深蓝色文字，对比粉色背景 */
            font-size: 18px;
            line-height: 1.8;
            margin-top: 20px;
        }

        /* --- 6. 装饰性图标（简单的CSS三角形做塔尖） --- */
        .turret {
            position: absolute;
            top: -20px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #9e2f50; /* 红色塔尖 */
        }
        .turret.left { left: 40px; }
        .turret.right { right: 40px; }

        /* --- 7. 简单的浮动动画 --- */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* --- 8. 打字机光标效果 --- */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 35px;
            background-color: #9e2f50;
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="castle-card">
        <!-- 装饰塔尖 -->
        <div class="turret left"></div>
        <div class="turret right"></div>

        <!-- 标题区域 -->
        <h1>
            Welcome to Sharing's Air Castle!
            <!-- 闪烁的光标 -->
            <span class="cursor"></span>
        </h1>

        <div class="divider"></div>

        <!-- 这里可以放你想说的话 -->
        <div class="content">
            <p>Here lies a world of mystery and art.</p>
            <p>Step inside and explore the magic.</p>
        </div>
    </div>

</body>
</html>

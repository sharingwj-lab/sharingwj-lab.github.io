<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的城堡简历</title>
    <style>
        /* --- 1. 整体背景与布局 --- */
        body {
            margin: 0;
            padding: 0;
            /* 这是一个非常有电影感的深红到深蓝的渐变背景 */
            background: linear-gradient(to bottom, #2c3e50, #4b000b);
            /* 使用衬线字体，更有文艺复古感 */
            font-family: "Georgia", "Times New Roman", serif;
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 2. 模仿“布达佩斯大饭店”的卡片设计 --- */
        .hotel-card {
            /* 这种淡粉色/淡紫色是布达佩斯大饭店的灵魂，我们稍微调淡一点，配合红蓝背景 */
            background-color: #f3e9e9;
            width: 400px;
            padding: 50px;
            text-align: center;
            /* 加上阴影，让卡片浮起来 */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            /* 边框设计：双层边框，很有复古感 */
            border: 2px solid #fff;
            outline: 10px solid #d63031; /* 鲜艳的红色外框 */
            outline-offset: -20px; /* 让外框往里缩一点，形成层次感 */
            position: relative;
        }

        /* --- 3. 文字排版 --- */
        h1 {
            font-size: 32px;
            letter-spacing: 2px;
            text-transform: uppercase; /* 字母大写，显得正式 */
            color: #2c3e50; /* 深蓝色文字 */
            margin-bottom: 10px;
            border-bottom: 2px solid #d63031; /* 底部加一条红线 */
            padding-bottom: 15px;
            display: inline-block;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
            font-style: italic; /* 斜体，增加文艺感 */
        }

        /* --- 4. 按钮设计（也就是你的“门”） --- */
        .door-btn {
            background-color: #2c3e50; /* 深蓝色按钮 */
            color: #f3e9e9; /* 浅色文字 */
            padding: 15px 30px;
            text-decoration: none; /* 去掉下划线 */
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid #2c3e50;
            transition: all 0.3s ease; /* 增加过渡动画 */
            display: inline-block;
            width: 80%;
        }

        /* 鼠标放上去的特效 */
        .door-btn:hover {
            background-color: #d63031; /* 变成红色 */
            border-color: #d63031;
            cursor: pointer;
            transform: scale(1.05); /* 稍微放大一点点 */
        }

        /* 装饰性的小图标 */
        .icon {
            font-size: 40px;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 这是你的大厅卡片 -->
    <div class="hotel-card">
        <!-- 装饰图标 -->
        <span class="icon">🏰</span>

        <!-- 标题 -->
        <h1>The Grand Portfolio</h1>

        <!-- 副标题/欢迎语 -->
        <p>欢迎来到我的个人城堡。<br>请推开这扇门，探索我的技能与故事。</p>

        <!-- 按钮（门） -->
        <!-- 这里 href="#" 代表链接，以后我们会改成真正的房间页面 -->
        <a href="#" class="door-btn">推开大门进入 &rarr;</a>
    </div>

</body>
</html>
